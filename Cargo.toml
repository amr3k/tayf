[package]
name = "tayf"
version = "0.2.3"
description = "A cross-platform Lottie animation viewer powered by GPUI"
authors = ["Amr <amr@a3k.me>"]
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
gpui = "0.2.2"
thorvg = { version = "0.5.1", features = ["vendored", "lottie", "svg", "png"] }
thorvg-sys = { version = "0.3", default-features = false }
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
gif = "0.13"
ffmpeg-sidecar = "2.4"
tempfile = "3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
parking_lot = "0.12"
futures = "0.3"
which = "6"
base64 = "0.22"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
